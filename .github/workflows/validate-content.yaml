name: Validate Content

on:
  pull_request:
    branches: [master]
    paths:
      - "**.md"
  pull_request_target:
    branches: [master]
    paths:
      - "**.md"
  # push:
  #   branches: [master]
  #   paths:
  #     - "**.md"

# Allow the action to post PR comments
# issues: write required for github-script to create/update comments (403 otherwise)
permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  validate:
    name: Content Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content repo (PR head)
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout the PR head explicitly (fork support)
          # For pull_request, these evaluate to the same repo/sha and are harmless
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch base branch for diff
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        run: git fetch origin ${{ github.base_ref }} --depth 1 || git fetch origin master --depth 1 || true

      # ─────────────────────────────────────────────
      # 1. Collect changed markdown files
      # ─────────────────────────────────────────────
      - name: Get changed markdown files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.md' | tr '\n' ' ')
          fi
          echo "Changed files: $FILES"
          echo "files=$FILES" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # 2. Set up tools
      # ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml
          npm install -g markdownlint-cli

      # ─────────────────────────────────────────────
      # 3. Run all checks, write errors to report file
      # ─────────────────────────────────────────────
      - name: Run all content checks
        id: checks
        if: always()
        run: |
          python3 << 'PYEOF'
          import os, sys, yaml, glob, re, json

          CHANGED = os.environ.get("CHANGED_FILES", "").split()
          all_md  = glob.glob("**/*.md", recursive=True)
          files   = [f for f in CHANGED if f] if CHANGED else all_md

          report = []

          def add(check, filepath, line, msg):
              report.append({"check": check, "file": filepath, "line": line, "msg": msg})

          # ── Frontmatter ─────────────────────────
          REQUIRED = ["title", "author"]
          for filepath in files:
              if not os.path.isfile(filepath):
                  continue
              content = open(filepath, encoding="utf-8").read()
              if not content.startswith("---"):
                  add("Frontmatter", filepath, 1, "Missing frontmatter block (must start with `---`)")
                  continue
              parts = content.split("---", 2)
              if len(parts) < 3:
                  add("Frontmatter", filepath, 1, "Malformed frontmatter — no closing `---`")
                  continue
              try:
                  fm = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError as e:
                  add("Frontmatter", filepath, 1, f"Invalid YAML in frontmatter: {e}")
                  continue
              for field in REQUIRED:
                  if field not in fm or not str(fm[field]).strip():
                      add("Frontmatter", filepath, 1, f"Missing required field `{field}`")
              # ── Tags naming (CONTRIBUTING.md:154-167) ──
              if "tags" in fm and fm["tags"] is not None:
                  tags = fm["tags"]
                  if not isinstance(tags, list):
                      add("Frontmatter", filepath, 1, "`tags` must be a YAML list")
                  else:
                      for tag in tags:
                          t = str(tag)
                          if t != t.lower() or " " in t or "_" in t or t != t.strip():
                              add("Frontmatter", filepath, 1, f"Tag `{t}` violates naming: lowercase + hyphen only (got `{t}`)")
                          if not re.match(r'^[a-z0-9][a-z0-9-]*$', t):
                              add("Frontmatter", filepath, 1, f"Tag `{t}` must match `^[a-z0-9][a-z0-9-]*$`")

          # ── File & image naming (CONTRIBUTING.md:82-94, 290-303) ──
          for filepath in files:
              if not os.path.isfile(filepath):
                  continue
              basename = os.path.basename(filepath)
              # allow index.md / README.md as special per CONTRIBUTING.md:180
              if basename not in ("index.md", "README.md", "Readme.md"):
                  if basename != basename.lower():
                      add("Naming", filepath, 1, f"File name `{basename}` must be lowercase (quartz slug is case-sensitive)")
                  if " " in basename or "_" in basename:
                      add("Naming", filepath, 1, f"File name `{basename}` must use `-` not spaces/underscores")
                  if not re.match(r'^[a-z0-9-]+\.md$', basename):
                      # allow dot only before md, so catch parens etc like migrating_arch(legally).md
                      add("Naming", filepath, 1, f"File name `{basename}` violates `lowercase-hyphen.md` pattern")
              # folder path naming check (each segment) - CONTRIBUTING.md:82 lowercase hyphen
              for part in os.path.dirname(filepath).split(os.sep):
                  if not part or part in (".", ".."):
                      continue
                  if part != part.lower():
                      add("Naming", filepath, 1, f"Folder `{part}` in path `{filepath}` must be lowercase (quartz slug is case-sensitive, see CONTRIBUTING.md:82)")
                  if " " in part:
                      add("Naming", filepath, 1, f"Folder `{part}` in path `{filepath}` must use `-` not spaces (see CONTRIBUTING.md:82)")
                  if "_" in part:
                      add("Naming", filepath, 1, f"Folder `{part}` in path `{filepath}` must use `-` not underscores (see CONTRIBUTING.md:82)")

          # ── Emoji / keycap sequences ─────────────
          KEYCAP = re.compile(r'[0-9#*]\uFE0F\u20E3')
          for filepath in files:
              if not os.path.isfile(filepath):
                  continue
              for lineno, line in enumerate(open(filepath, encoding="utf-8"), 1):
                  if KEYCAP.search(line):
                      add("Emoji", filepath, lineno,
                          "Unsupported keycap emoji (e.g. 1️⃣) — breaks Quartz OG image generation. Replace with plain text or a supported emoji.")

          # ── Broken internal links + image existence ──
          # Quartz renders markdown via Plugin.CrawlLinks + Plugin.Assets:
          # - internal wikilinks / md links must resolve to a known slug
          # - image/asset links (imgs/, .png/.jpg etc.) must exist on disk, not in slug set
          known = set()
          for f in all_md:
              slug = os.path.splitext(f)[0].lstrip("./")
              known.add(slug.lower())
              known.add(os.path.basename(slug).lower())

          WIKILINK = re.compile(r'\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]')
          MD_LINK  = re.compile(r'\[[^\]]*\]\((?!https?://)([^)#]+?)(?:#[^)]*)?\)')
          # also catch <img src="..."> HTML tags used in some notes
          IMG_SRC  = re.compile(r'<img[^>]+src=["\']([^"\']+)["\']', re.IGNORECASE)
          IMAGE_EXTS = (".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".bmp", ".ico")

          def is_asset_path(target: str) -> bool:
              t = target.lower()
              return t.startswith("imgs/") or t.startswith("./imgs/") or t.endswith(IMAGE_EXTS)

          for filepath in files:
              if not os.path.isfile(filepath):
                  continue
              for lineno, line in enumerate(open(filepath, encoding="utf-8"), 1):
                  if line.strip().startswith("```"):
                      continue
                  # wikilinks
                  for m in WIKILINK.finditer(line):
                      target = os.path.splitext(m.group(1).strip())[0].lower()
                      if target not in known:
                          add("Links", filepath, lineno, f"Broken wikilink: `[[{m.group(1)}]]`")
                  # markdown links / images - same regex captures both [text](url) and ![alt](url)
                  for m in MD_LINK.finditer(line):
                      raw_target = m.group(1).strip()
                      if raw_target.startswith("mailto:") or raw_target.startswith("#"):
                          continue
                      # asset / image handling - check file existence on disk
                      if is_asset_path(raw_target):
                          # strip leading ./ and query/hash fragments
                          asset_path = raw_target.split("#")[0].split("?")[0].lstrip("./")
                          # resolve relative to repo root (CONTRIBUTING: path relative to repo root)
                          # also try relative to the markdown file directory for robustness
                          candidates = [
                              asset_path,
                              os.path.join(os.path.dirname(filepath), asset_path),
                              os.path.join(os.path.dirname(filepath), os.path.basename(asset_path)),
                          ]
                          if not any(os.path.isfile(c) for c in candidates):
                              add("Links", filepath, lineno, f"Missing image/asset: `({raw_target})` — file not found on disk")
                          continue
                      # skip absolute / external already filtered by regex, but keep /imgs?
                      if raw_target.startswith("/"):
                          # Quartz Plugin.Static copies assets preserving path; check without leading /
                          if is_asset_path(raw_target.lstrip("/")):
                              asset_path = raw_target.lstrip("/")
                              if not os.path.isfile(asset_path):
                                  add("Links", filepath, lineno, f"Missing image/asset: `({raw_target})` — file not found at `{asset_path}`")
                              continue
                          continue
                      slug = os.path.splitext(raw_target.lstrip("./"))[0].lower()
                      if slug not in known:
                          add("Links", filepath, lineno, f"Broken markdown link: `({raw_target})`")
                  # HTML <img src>
                  for m in IMG_SRC.finditer(line):
                      raw_target = m.group(1).strip()
                      if raw_target.startswith("http://") or raw_target.startswith("https://"):
                          continue
                      if is_asset_path(raw_target) or raw_target.startswith("imgs/"):
                          asset_path = raw_target.split("#")[0].split("?")[0].lstrip("./").lstrip("/")
                          if not os.path.isfile(asset_path):
                              add("Links", filepath, lineno, f"Missing <img> asset: `{raw_target}` — file not found at `{asset_path}`")

          # ── Write report ─────────────────────────
          with open("/tmp/check_report.json", "w") as f:
              json.dump(report, f)

          if report:
              sys.exit(1)
          PYEOF
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}

      # ─────────────────────────────────────────────
      # 4. Markdown lint — append to report
      # ─────────────────────────────────────────────
      - name: Markdown lint
        if: always()
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            FILES=$(find . -name "*.md" | tr '\n' ' ')
          fi

          # Write output to file — avoids fragile inline variable interpolation into Python
          markdownlint $FILES --disable MD013 MD033 MD041 > /tmp/lint_out.txt 2>&1 || true

          python3 << 'PYEOF'
          import json, re

          lint_raw = open("/tmp/lint_out.txt").read()
          report_path = "/tmp/check_report.json"

          try:
              report = json.load(open(report_path))
          except Exception:
              report = []

          pattern = re.compile(r'^(.+?):(\d+)(?::\d+)?\s+(MD\d+\S+.*)$')
          added = 0
          for line in lint_raw.splitlines():
              m = pattern.match(line.strip())
              if m:
                  report.append({
                      "check": "Markdown Lint",
                      "file": m.group(1),
                      "line": int(m.group(2)),
                      "msg": m.group(3)
                  })
                  added += 1

          with open(report_path, "w") as f:
              json.dump(report, f)

          if added:
              exit(1)
          PYEOF

      # ─────────────────────────────────────────────
      # 5. Post PR comment with all errors
      # ─────────────────────────────────────────────
      - name: Post failure comment on PR
        if: failure() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = [];
            try {
              report = JSON.parse(fs.readFileSync('/tmp/check_report.json', 'utf8'));
            } catch (e) {
              core.warning('Could not read report file: ' + e);
            }

            if (report.length === 0) return;

            const groups = {};
            for (const item of report) {
              if (!groups[item.check]) groups[item.check] = [];
              groups[item.check].push(item);
            }

            const icons = {
              "Frontmatter":   "📋",
              "Emoji":         "🔣",
              "Links":         "🔗",
              "Markdown Lint": "📝",
              "Naming":        "🏷️",
            };

            let body = `## ❌ Content Validation Failed\n\n`;
            body += `Found **${report.length} issue(s)** in the changed files. Please fix them before merging.\n\n---\n\n`;

            for (const [check, items] of Object.entries(groups)) {
              const icon = icons[check] || "⚠️";
              body += `### ${icon} ${check} — ${items.length} issue${items.length > 1 ? 's' : ''}\n\n`;
              body += `| File | Line | Issue |\n|------|------|-------|\n`;
              for (const item of items) {
                body += `| \`${item.file}\` | ${item.line} | ${item.msg} |\n`;
              }
              body += `\n`;
            }

            body += `---\n> 💡 Fix the issues above, push again, and this check will re-run automatically.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Content Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ─────────────────────────────────────────────
      # 6. Update comment to green when all fixed
      # ─────────────────────────────────────────────
      - name: Post success comment on PR
        if: success() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Content Validation')
            );

            const body = `## ✅ Content Validation Passed\n\nAll checks passed — frontmatter, links, emoji, and markdown syntax look good! Ready to merge. 🎉`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }